name: Release

# Cut a release when a semver tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The job refuses to publish unless the tag matches the VERSION file, then
# generates SHA256SUMS over the two updater artifacts and creates the GitHub
# release. This mirrors the client-side check in kiro-profile.sh's updater,
# which rejects a downloaded VERSION that doesn't match the release tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          echo "tag=${tag} VERSION=${file_version}"
          if [ "$tag" != "$file_version" ]; then
            echo "::error::tag v${tag} does not match VERSION (${file_version}); bump VERSION or retag" >&2
            exit 1
          fi

      - name: Lint kiro-profile.sh (shellcheck, POSIX sh)
        run: shellcheck -s sh kiro-profile.sh

      - name: Generate SHA256SUMS
        run: |
          set -eu
          # Bare filenames so the client's `grep -F " <name>"` matches.
          sha256sum kiro-profile.sh VERSION > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" \
            kiro-profile.sh VERSION SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
